<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770" role="img" aria-labelledby="title desc"><title id="title">Capital qualification Kanban wireframe</title><desc id="desc">Six capital relationship stages with sample cards, accessible move controls and an evidence requirement for protected transitions.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1440" height="770" rx="0" fill="#f3f5f8" stroke="none"/><text x="28" y="38" font-size="22" fill="#172f3c" font-weight="700">RECOMMENDED WIREFRAME · CAPITAL QUALIFICATION BOARD</text><text x="28" y="65" font-size="14" fill="#607184" font-weight="400">Illustrative records · qualification stage, project lifecycle and review eligibility remain separate</text><rect x="28" y="90" width="100" height="36" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="40" y="113" font-size="13" fill="#243447" font-weight="600">Queue</text><rect x="138" y="90" width="100" height="36" rx="6" fill="#174b55" stroke="#174b55"/><text x="150" y="113" font-size="13" fill="#fff" font-weight="600">Kanban</text><rect x="258" y="95" width="192" height="26" rx="13" fill="#eef2f6" stroke="none"/><text x="268" y="113" font-size="12" fill="#243447" font-weight="400">Workflow: Capital origination</text><rect x="1220" y="90" width="190" height="36" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="1232" y="113" font-size="13" fill="#243447" font-weight="600">Filter / saved views</text><rect x="28" y="148" width="220" height="474" rx="8" fill="#eaf0f4" stroke="none"/><text x="40" y="178" font-size="14" fill="#172f3c" font-weight="700">Discovered</text><text x="40" y="201" font-size="11" fill="#607184" font-weight="400">1 illustrative opportunity</text><rect x="38" y="220" width="200" height="220" rx="8" fill="#fff" stroke="#d8dee7"/><text x="50" y="247" font-size="13" fill="#172f3c" font-weight="600">North Shore Mixed-Use</text><rect x="50" y="262" width="92" height="26" rx="13" fill="#eef2f6" stroke="none"/><text x="60" y="280" font-size="12" fill="#243447" font-weight="400">Research</text><text x="50" y="314" font-size="12" fill="#607184" font-weight="400">Project stage:</text><text x="50" y="335" font-size="12" fill="#243447" font-weight="400">Preconstruction</text><text x="50" y="364" font-size="12" fill="#607184" font-weight="400">Next action:</text><text x="50" y="385" font-size="11" fill="#243447" font-weight="400">Verify sponsor</text><rect x="50" y="400" width="174" height="36" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="62" y="423" font-size="13" fill="#243447" font-weight="600">Open / Move to...</text><rect x="260" y="148" width="220" height="474" rx="8" fill="#eaf0f4" stroke="none"/><text x="272" y="178" font-size="14" fill="#172f3c" font-weight="700">Sponsor verified</text><text x="272" y="201" font-size="11" fill="#607184" font-weight="400">1 illustrative opportunity</text><rect x="270" y="220" width="200" height="220" rx="8" fill="#fff" stroke="#d8dee7"/><text x="282" y="247" font-size="13" fill="#172f3c" font-weight="600">Valley Apartments</text><rect x="282" y="262" width="92" height="26" rx="13" fill="#eef2f6" stroke="none"/><text x="292" y="280" font-size="12" fill="#243447" font-weight="400">Review</text><text x="282" y="314" font-size="12" fill="#607184" font-weight="400">Project stage:</text><text x="282" y="335" font-size="12" fill="#243447" font-weight="400">Preconstruction</text><text x="282" y="364" font-size="12" fill="#607184" font-weight="400">Next action:</text><text x="282" y="385" font-size="11" fill="#243447" font-weight="400">Confirm capital timing</text><rect x="282" y="400" width="174" height="36" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="294" y="423" font-size="13" fill="#243447" font-weight="600">Open / Move to...</text><rect x="492" y="148" width="220" height="474" rx="8" fill="#eaf0f4" stroke="none"/><text x="504" y="178" font-size="14" fill="#172f3c" font-weight="700">Financing discussion</text><text x="504" y="201" font-size="11" fill="#607184" font-weight="400">1 illustrative opportunity</text><rect x="502" y="220" width="200" height="220" rx="8" fill="#fff" stroke="#d8dee7"/><text x="514" y="247" font-size="13" fill="#172f3c" font-weight="600">Westside Renewal</text><rect x="514" y="262" width="92" height="26" rx="13" fill="#eef2f6" stroke="none"/><text x="524" y="280" font-size="12" fill="#243447" font-weight="400">Review</text><text x="514" y="314" font-size="12" fill="#607184" font-weight="400">Project stage:</text><text x="514" y="335" font-size="12" fill="#243447" font-weight="400">Construction</text><text x="514" y="364" font-size="12" fill="#607184" font-weight="400">Next action:</text><text x="514" y="385" font-size="11" fill="#243447" font-weight="400">Record needs and timing</text><rect x="514" y="400" width="174" height="36" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="526" y="423" font-size="13" fill="#243447" font-weight="600">Open / Move to...</text><rect x="724" y="148" width="220" height="474" rx="8" fill="#eaf0f4" stroke="none"/><text x="736" y="178" font-size="14" fill="#172f3c" font-weight="700">Qualified mandate</text><text x="736" y="201" font-size="11" fill="#607184" font-weight="400">1 illustrative opportunity</text><rect x="734" y="220" width="200" height="220" rx="8" fill="#fff" stroke="#d8dee7"/><text x="746" y="247" font-size="13" fill="#172f3c" font-weight="600">Harbour Industrial</text><rect x="746" y="262" width="92" height="26" rx="13" fill="#eef2f6" stroke="none"/><text x="756" y="280" font-size="12" fill="#243447" font-weight="400">Ready</text><text x="746" y="314" font-size="12" fill="#607184" font-weight="400">Project stage:</text><text x="746" y="335" font-size="12" fill="#243447" font-weight="400">Construction</text><text x="746" y="364" font-size="12" fill="#607184" font-weight="400">Next action:</text><text x="746" y="385" font-size="11" fill="#243447" font-weight="400">Prepare agreed package</text><rect x="746" y="400" width="174" height="36" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="758" y="423" font-size="13" fill="#243447" font-weight="600">Open / Move to...</text><rect x="956" y="148" width="220" height="474" rx="8" fill="#eaf0f4" stroke="none"/><text x="968" y="178" font-size="14" fill="#172f3c" font-weight="700">Lender review</text><text x="968" y="201" font-size="11" fill="#607184" font-weight="400">1 illustrative opportunity</text><rect x="966" y="220" width="200" height="220" rx="8" fill="#fff" stroke="#d8dee7"/><text x="978" y="247" font-size="13" fill="#172f3c" font-weight="600">Metro Mixed-Use</text><rect x="978" y="262" width="92" height="26" rx="13" fill="#eef2f6" stroke="none"/><text x="988" y="280" font-size="12" fill="#243447" font-weight="400">Ready</text><text x="978" y="314" font-size="12" fill="#607184" font-weight="400">Project stage:</text><text x="978" y="335" font-size="12" fill="#243447" font-weight="400">Construction</text><text x="978" y="364" font-size="12" fill="#607184" font-weight="400">Next action:</text><text x="978" y="385" font-size="11" fill="#243447" font-weight="400">Follow up on submission</text><rect x="978" y="400" width="174" height="36" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="990" y="423" font-size="13" fill="#243447" font-weight="600">Open / Move to...</text><rect x="1188" y="148" width="220" height="474" rx="8" fill="#eaf0f4" stroke="none"/><text x="1200" y="178" font-size="14" fill="#172f3c" font-weight="700">Outcome</text><text x="1200" y="201" font-size="11" fill="#607184" font-weight="400">1 illustrative opportunity</text><rect x="1198" y="220" width="200" height="220" rx="8" fill="#fff" stroke="#d8dee7"/><text x="1210" y="247" font-size="13" fill="#172f3c" font-weight="600">Hillside Infill</text><rect x="1210" y="262" width="92" height="26" rx="13" fill="#eef2f6" stroke="none"/><text x="1220" y="280" font-size="12" fill="#243447" font-weight="400">Closed</text><text x="1210" y="314" font-size="12" fill="#607184" font-weight="400">Project stage:</text><text x="1210" y="335" font-size="12" fill="#243447" font-weight="400">Construction</text><text x="1210" y="364" font-size="12" fill="#607184" font-weight="400">Next action:</text><text x="1210" y="385" font-size="11" fill="#243447" font-weight="400">Won / lost / no need</text><rect x="1210" y="400" width="174" height="36" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="1222" y="423" font-size="13" fill="#243447" font-weight="600">Open / Move to...</text><rect x="28" y="645" width="1380" height="94" rx="8" fill="#fff" stroke="#d8dee7"/><text x="46" y="670" font-size="12" fill="#607184" font-weight="700">GUARDED MOVE EXAMPLE</text><text x="46" y="696" font-size="15" fill="#243447" font-weight="400">Moving into Qualified mandate requires a recorded mandate, confirmation evidence and reviewer.</text><text x="46" y="719" font-size="13" fill="#795816" font-weight="400">Missing evidence: retain the original stage and offer “Record confirmation”. Dragging alone never establishes qualification.</text></g></svg>
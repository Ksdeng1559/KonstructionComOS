th="552" height="106" rx="6" fill="#fff" stroke="#e3e8ef"/><text x="265" y="728" font-size="15" fill="#172f3c" font-weight="600">Industrial Renewal</text><text x="265" y="751" font-size="12" fill="#607184" font-weight="400">REL-01 · Existing relationship</text><text x="265" y="773" font-size="12" fill="#243447" font-weight="400">New project activity</text><rect x="265" y="781" width="88" height="26" rx="13" fill="#eef2f6" stroke="none"/><text x="275" y="799" font-size="12" fill="#243447" font-weight="400">Review</text><text x="564" y="755" font-size="12" fill="#243447" font-weight="400">Review notes</text><text x="564" y="775" font-size="12" fill="#607184" font-weight="400">Open briefing</text><rect x="252" y="819" width="552" height="106" rx="6" fill="#fff" stroke="#e3e8ef"/><text x="265" y="842" font-size="15" fill="#172f3c" font-weight="600">Burnaby Infill</text><text x="265" y="865" font-size="12" fill="#607184" font-weight="400">CAP-02 · Preconstruction</text><text x="265" y="887" font-size="12" fill="#243447" font-weight="400">Existing funding confirmed</text><rect x="265" y="895" width="88" height="26" rx="13" fill="#eef2f6" stroke="none"/><text x="275" y="913" font-size="12" fill="#243447" font-weight="400">Hold</text><text x="564" y="869" font-size="12" fill="#243447" font-weight="400">Review timing</text><text x="564" y="889" font-size="12" fill="#607184" font-weight="400">Open briefing</text><text x="260" y="994" font-size="12" fill="#607184" font-weight="400">Showing 4 illustrative hypotheses · select a row to review</text><rect x="830" y="430" width="584" height="576" rx="8" fill="#fff" stroke="#d8dee7"/><text x="850" y="462" font-size="20" fill="#172f3c" font-weight="700">North Shore Mixed-Use</text><rect x="850" y="480" width="130" height="26" rx="13" fill="#eef2f6" stroke="none"/><text x="860" y="498" font-size="12" fill="#243447" font-weight="400">Research needed</text><rect x="1258" y="443" width="136" height="36" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="1270" y="466" font-size="13" fill="#243447" font-weight="600">Expand</text><text x="850" y="532" font-size="12" fill="#607184" font-weight="700">1  WHAT CHANGED</text><text x="850" y="556" font-size="15" fill="#243447" font-weight="600">Permit milestone recorded</text><text x="850" y="578" font-size="12" fill="#607184" font-weight="400">Sample municipal source · event date: unknown</text><text x="850" y="600" font-size="12" fill="#176071" font-weight="400">View source record ↗  ·  View history</text><text x="850" y="638" font-size="12" fill="#607184" font-weight="700">2  WHY IT MAY MATTER</text><text x="850" y="662" font-size="14" fill="#243447" font-weight="400">May justify a financing-readiness conversation.</text><text x="850" y="684" font-size="13" fill="#8a5d16" font-weight="400">Hypothesis only. Financing need remains unknown.</text><text x="850" y="722" font-size="12" fill="#607184" font-weight="700">3  WHO TO VERIFY</text><text x="850" y="746" font-size="14" fill="#243447" font-weight="400">Sponsor / finance lead · not yet verified</text><text x="850" y="768" font-size="12" fill="#607184" font-weight="400">Applicant identity does not establish ownership.</text><text x="850" y="806" font-size="12" fill="#607184" font-weight="700">4  NEXT USEFUL ACTION</text><text x="850" y="830" font-size="14" fill="#243447" font-weight="400">Confirm sponsor, financing status and timing.</text><rect x="850" y="850" width="181" height="36" rx="6" fill="#174b55" stroke="#174b55"/><text x="862" y="873" font-size="12" fill="#fff" font-weight="600">Create verification task</text><rect x="1041" y="850" width="151" height="36" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="1053" y="873" font-size="12" fill="#243447" font-weight="600">Record confirmation</text><rect x="850" y="900" width="544" height="46" rx="6" fill="#fff8e7" stroke="#ead7a4"/><text x="862" y="920" font-size="12" fill="#795816" font-weight="400">Promotion unavailable: commercial need unconfirmed.</text><text x="862" y="937" font-size="12" fill="#795816" font-weight="400">Demo records cannot activate a live opportunity.</text><rect x="850" y="957" width="126" height="36" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="862" y="980" font-size="13" fill="#243447" font-weight="600">Save shortlist</text><rect x="986" y="957" width="111" height="36" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="998" y="980" font-size="12" fill="#243447" font-weight="600">Hold / dismiss</text><text x="1110" y="980" font-size="11" fill="#607184" font-weight="400">Draft only; no sending</text></g></svg>